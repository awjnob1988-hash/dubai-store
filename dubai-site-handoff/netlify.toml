[build]
  publish = "dist"
  command = "node ../install-admin.cjs"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/api-modern"
  status = 200
[[redirects]]
  from = "/products/*"
  to = "/product-template/"
  status = 200
[[redirects]]
  from = "/*"
  to = "/category-template/"
  status = 200
