<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم معرض دبي V2 | إدارة المتجر</title><link rel="icon" href="/assets/logo.png"><style>
@font-face{font-family:hayya;src:url('/assets/fonts/hayyakum-regular.woff')}@font-face{font-family:hayya;src:url('/assets/fonts/hayyakum-bold.woff');font-weight:700}
:root{--navy:#112e50;--blue:#174577;--orange:#ee8c27;--bg:#f5f8fc;--line:#e1e7ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:hayya,system-ui;color:#193352;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.muted{color:#71839a}.hide{display:none!important}#login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#092440,#255783)}.loginbox{max-width:420px;width:100%;background:white;padding:34px;border-radius:25px;box-shadow:0 20px 60px #00152a48;text-align:center}.loginbox img{width:90px;height:80px;object-fit:contain}.loginbox h1{font-size:24px;margin:8px 0}.loginbox label{text-align:right;display:block;margin:16px 0 6px}.loginbox input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px}.primary{border:0;background:var(--orange);color:#222;padding:12px 20px;border-radius:12px;font-weight:700}.loginbox .primary{width:100%;margin-top:24px}.layout{display:flex;min-height:100vh}aside{background:var(--navy);color:white;width:250px;padding:24px 14px;flex-shrink:0;position:sticky;top:0;height:100vh}aside .logo{display:flex;align-items:center;gap:12px;padding:10px 7px 30px;border-bottom:1px solid #ffffff25;margin-bottom:26px}aside img{width:55px;height:55px;object-fit:contain}.nav{display:flex;flex-direction:column;gap:6px}.nav button{background:transparent;color:#dceaff;border:0;text-align:right;padding:15px;border-radius:12px}.nav button.active,.nav button:hover{background:#27527b;color:white}.nav small{margin-top:24px;color:#8fb0cb}.main{flex:1;min-width:0;padding:28px 34px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:26px;flex-wrap:wrap}.top h1{font-size:28px;margin:0}.top p{margin:3px 0 0}.tools{display:flex;gap:8px;align-items:center}.secondary{background:white;border:1px solid var(--line);color:var(--navy);border-radius:12px;padding:10px 15px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.stat,.panel{background:white;border:1px solid #e7edf4;border-radius:20px;padding:22px;box-shadow:0 5px 24px #14324c08}.stat small{color:#7087a2}.stat strong{font-size:33px;display:block;margin-top:7px}.panel{margin-top:19px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.sectionhead h2{font-size:20px;margin:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.product{border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px}.product img{width:100%;height:145px;object-fit:contain;background:#f5f8fc;border-radius:11px}.product h3{font-size:16px;margin:8px 0 5px}.product p{margin:4px 0;color:#71839a;font-size:13px}.buttons{display:flex;gap:8px;margin-top:12px}.buttons button{flex:1}.danger{background:#fff5f4;color:#aa3535;border:1px solid #ffd6d2;border-radius:10px;padding:9px 12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.wide{grid-column:1/-1}.field label{font-weight:700;font-size:14px}.field input,.field select,.field textarea,.search{background:white;border:1px solid #d8e1eb;border-radius:10px;padding:11px 12px;min-width:0;width:100%;color:#163754}.field textarea{min-height:110px}.condition-price-fields{display:contents}.condition-price-fields.hide{display:none!important}.hint{font-size:12px;color:#647e9b;margin:2px 0}.condition-line{grid-column:1/-1}.status{padding:12px 16px;border-radius:11px;margin-bottom:18px;background:#edf5ff;color:#28527b;display:none}.status.error{background:#fff1f1;color:#9b3333}.modal{position:fixed;inset:0;background:#0d254ca6;display:none;align-items:center;justify-content:center;z-index:5;padding:18px}.modal.show{display:flex}.dialog{background:white;border-radius:22px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 18px 60px #0002}.dialog h2{margin:0 0 20px}.dialogactions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.label-tag{display:inline-block;background:#eaf3fe;border-radius:20px;color:#336596;padding:5px 11px;font-size:12px}.empty{padding:30px;text-align:center;color:#647e9b}.footer-link{color:#ecb576;text-decoration:none;margin-top:22px;display:block}
@media(max-width:820px){.layout{display:block}aside{width:100%;height:auto;position:static;padding:9px}.nav{flex-direction:row;overflow-x:auto}.nav button{white-space:nowrap;padding:12px}.nav small,aside .logo{display:none}.main{padding:17px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.top h1{font-size:23px}}
</style><link rel="stylesheet" href="/admin-v2/v2.css"></head><body>
<div id="login"><form class="loginbox" id="login-form"><img src="/assets/logo.png" alt="شعار معرض دبي"><h1>لوحة تحكم معرض دبي <span class="v2-brand-badge" style="color:#1b557e;background:#e7f2fa">V2</span></h1><p class="muted">نفس هوية معرض دبي — إدارة أوضح وأسهل</p><label>اسم المستخدم</label><input id="username" required value="admin" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button class="primary" type="submit">تسجيل الدخول ←</button><p class="muted" id="login-msg"></p></form></div>
<div id="application" class="layout hide"><aside><div class="logo"><img src="/assets/logo.png" alt=""><div><b>معرض دبي</b><div style="color:#9ec5ee;font-size:12px">الإدارة الاحترافية · V2</div></div></div><nav class="nav"><button data-view="overview" class="active"><span class="navicon">▦</span> الرئيسية</button><button data-view="products"><span class="navicon">▣</span> إدارة المنتجات</button><button data-view="categories"><span class="navicon">▤</span> الأقسام</button><button data-view="settings"><span class="navicon">⚙</span> إعدادات المتجر</button><button data-view="media"><span class="navicon">▧</span> الصور والبنرات</button><small>المدير</small></nav><a class="footer-link" href="/" target="_blank">↗ عرض المتجر</a></aside><div class="main"><header class="top"><div><span class="subline">معرض دبي / لوحة الإدارة الجديدة</span><h1 id="page-title">لوحة التحكم</h1><p id="page-subtitle" class="muted">تحكّم بمنتجات معرض دبي من مكان واحد</p></div><div class="tools"><button id="reload" class="secondary">تحديث البيانات</button><button id="logout" class="secondary">خروج</button></div></header><div id="notice" class="status"></div><div id="content"></div><footer class="v2-footer">معرض دبي • إدارة المنتجات والبيانات بأمان • لوحة التحكم V2</footer></div></div>
<div class="modal" id="modal"><div class="dialog"><div class="sectionhead"><h2 id="dialog-title">إضافة</h2><button id="close" class="secondary">إغلاق ×</button></div><form id="editor"><div class="formgrid" id="fields"></div><div class="dialogactions"><button type="button" class="secondary" id="cancel">إلغاء</button><button class="primary" type="submit">حفظ ونشر على المتجر</button></div></form></div></div>
<script>
(function(){
'use strict';
var api='/api/data?action=',token=sessionStorage.getItem('dubai-admin-v2-token')||'',catalog=null,version='',view='overview',editing=null,kind='',imported=true;
var $=s=>document.querySelector(s),escape=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function photo(s){return String(s||'').startsWith('uploads/')?api+'image&file='+encodeURIComponent(s):'/assets/'+encodeURIComponent(s||'iphone15.png')}
function note(msg,bad){let el=$('#notice');el.style.display='block';el.className='status'+(bad?' error':'');el.textContent=msg;setTimeout(()=>{if(el.textContent===msg)el.style.display='none'},6500)}
async function request(action,body){let h={'Accept':'application/json'};if(token)h.Authorization='Bearer '+token;if(body!==undefined)h['Content-Type']='application/json';let r=await fetch(api+action,{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر الاتصال بالخادم');return d}
function showapp(on){$('#login').classList.toggle('hide',on);$('#application').classList.toggle('hide',!on)}
async function load(){let r=await request('workspace');catalog=r.catalog;version=r.version;imported=r.imported!==false;showapp(true);render()}
async function login(e){e.preventDefault();$('#login-msg').textContent='جارٍ تسجيل الدخول...';try{let r=await request('login',{username:$('#username').value,password:$('#password').value});token=r.token;sessionStorage.setItem('dubai-admin-v2-token',token);$('#password').value='';await load()}catch(err){$('#login-msg').textContent=err.message}}
$('#login-form').addEventListener('submit',login);
$('#logout').onclick=()=>{token='';sessionStorage.removeItem('dubai-admin-v2-token');showapp(false)};
$('#reload').onclick=()=>load().then(()=>note('تم تحديث البيانات')).catch(e=>note(e.message,true));
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
async function publish(next=catalog){let r=await request('publish',{catalog:next,version:version});catalog=next;version=r.version;note('تم حفظ التغييرات ونشرها في الموقع بنجاح');render()}
function conditionOf(p){
 if(['new','used','both'].includes(p.condition))return p.condition;
 const n=Number(p.prices?.new?.[0])>0||Number(p.prices?.new?.[1])>0;
 const u=Number(p.prices?.used?.[0])>0||Number(p.prices?.used?.[1])>0;
 return n&&u?'both':u?'used':'new';
}
function selectOptions(items,current){return items.map(c=>'<option value="'+escape(c.id)+'" '+(current===c.id?'selected':'')+'>'+escape(c.title)+'</option>').join('')}
function render(){
document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
const names={overview:'لوحة التحكم',products:'إدارة المنتجات',categories:'الأقسام والتصنيفات',settings:'إعدادات المتجر',media:'الصور والبنرات'};
const descriptions={overview:'كل تفاصيل متجرك واضحة من مكان واحد',products:'أضف الأجهزة وعدّل الأسعار والحالة بسهولة',categories:'نظّم أقسام المتجر وصورها',settings:'معلومات متجرك والتواصل والفروع',media:'غيّر الصورة الرئيسية دون تعديل أي كود'};
$('#page-title').textContent=names[view];$('#page-subtitle').textContent=descriptions[view];
let out='',visible=catalog.products.filter(p=>p.active!==false);
if(view==='overview'){
 const used=catalog.products.filter(p=>conditionOf(p)==='used').length;
 const stats=[['إجمالي المنتجات',catalog.products.length,'▣'],['الأقسام والتصنيفات',catalog.categories.length,'▤'],['المنتجات المنشورة',visible.length,'✓'],['الأجهزة المستعملة',used,'◷']];
 out=(!imported?'<section class="panel" style="margin-top:0;border-color:#f8d4a5;background:#fffdf6"><h2 style="margin:0 0 7px">جاهز لاستيراد بيانات معرض دبي</h2><p class="panel-note">هذه نسخة جديدة على Cloudflare. قبل تعديل المنتجات، انسخ بيانات وصور المتجر الحالي من Netlify مرة واحدة بأمان.</p><div style="margin-top:12px"><button class="primary" id="import-legacy">استيراد المنتجات والصور من الموقع القديم ←</button></div></section>':'')+'<div class="stats">'+stats.map((s,i)=>'<div class="stat '+(i===2?'accent':'')+'"><small>'+s[0]+'</small><span class="stat-ico">'+s[2]+'</span><strong>'+s[1]+'</strong></div>').join('')+'</div>';
 out+='<div class="dashboard-grid"><section class="panel"><div class="sectionhead"><div><h2>إدارة سريعة</h2><p>ابدأ بإضافة منتج أو تنظيم أقسام المعرض</p></div></div><div class="quick-actions"><button class="primary" id="quick-product">＋ إضافة منتج جديد</button><button class="secondary" id="quick-category">＋ إضافة قسم جديد</button></div><div class="quick-help">تظهر التغييرات في المتجر بعد الضغط على «حفظ ونشر». ويمكنك تحديث البيانات بأمان في أي وقت.</div></section>';
 out+='<section class="panel"><div class="sectionhead"><div><h2>آخر المنتجات</h2><p>أحدث العناصر في المتجر</p></div></div><div class="mini-list">'+catalog.products.slice(0,4).map(p=>'<div class="mini-item"><img src="'+escape(photo(p.image))+'" alt=""><div class="txt"><b>'+escape(p.name)+'</b><span>'+escape(catalog.categories.find(c=>c.id===p.category)?.title||'')+' · '+(conditionOf(p)==='used'?'مستعمل':conditionOf(p)==='new'?'جديد':'جديد ومستعمل')+'</span></div><button class="secondary" data-overview-edit="'+escape(p.id)+'">تعديل</button></div>').join('')+'</div></section></div>';
}
if(view==='products'){
 out='<section class="panel"><div class="sectionhead"><div><h2>المنتجات ('+catalog.products.length+')</h2><p>جميع المنتجات مع الصور والأسعار وحالة الجهاز</p></div><button class="primary" id="add-product">＋ إضافة منتج</button></div>';
 out+='<div class="products-controls"><input id="search" class="search" aria-label="ابحث عن اسم أو ماركة" placeholder="ابحث عن اسم المنتج أو الماركة..."><select id="filter" class="search" aria-label="تصفية حسب القسم"><option value="">جميع الأقسام</option>'+selectOptions(catalog.categories)+'</select><select id="condition-filter" class="search" aria-label="تصفية حسب الحالة"><option value="">كل الحالات</option><option value="new">جديد</option><option value="used">مستعمل</option><option value="both">جديد ومستعمل</option></select></div><div id="product-cards" class="cards"></div></section>';
}
if(view==='categories'){
 out='<section class="panel"><div class="sectionhead"><div><h2>الأقسام ('+catalog.categories.length+')</h2><p>صورة وعنوان ووصف مستقل لكل قسم</p></div><button class="primary" id="add-category">＋ إضافة قسم جديد</button></div><div class="cards">';
 out+=catalog.categories.map(c=>'<article class="product"><img src="'+escape(photo(c.image))+'" alt=""><span class="label-tag">قسم رئيسي</span><h3>'+escape(c.title)+'</h3><p>'+escape(c.sub)+'</p><p><b>'+catalog.products.filter(p=>p.category===c.id).length+'</b> منتج داخل القسم</p><div class="buttons"><button class="secondary" data-edit-cat="'+escape(c.id)+'">تعديل</button><button class="danger" data-del-cat="'+escape(c.id)+'">حذف</button></div></article>').join('')+'</div></section>';
}
if(view==='settings'){
 const s=catalog.site||{};
 const sf=(key,title,fallback)=>'<div class="field"><label>'+title+'</label><input name="'+key+'" value="'+escape(s[key]??fallback)+'"></div>';
 out='<section class="panel"><div class="sectionhead"><div><h2>إعدادات المتجر</h2><p>الحقول محفوظة في بيانات المتجر — دون الحاجة إلى GitHub</p></div></div><form id="settings-form">';
 out+='<div class="setting-block"><h3>المعلومات الأساسية</h3><div class="setting-grid">'+sf('name','اسم المتجر','معرض دبي')+sf('tagline','الوصف المختصر','للموبايلات والكاميرات')+sf('whatsapp','رقم واتساب الدولي','9647722282272')+'</div></div>';
 out+='<div class="setting-block"><h3>محتوى الصفحة الرئيسية</h3><div class="setting-grid">'+sf('heroTitle','عنوان الرئيسية','')+sf('heroDescription','وصف الرئيسية','')+'</div></div>';
 out+='<div class="setting-block"><h3>عناوين الفروع</h3><div class="setting-grid">'+sf('branch1Title','اسم الفرع الأول','الفرع الرئيسي')+sf('branch1Address','عنوان الفرع الأول','')+sf('branch2Title','اسم الفرع الثاني','الفرع الثاني')+sf('branch2Address','عنوان الفرع الثاني','')+'</div></div>';
 out+='<div class="setting-actions"><button class="primary" type="submit">حفظ ونشر الإعدادات ←</button></div></form></section>';
}
if(view==='media'){
 const img=catalog.site?.heroImage;
 out='<section class="panel"><div class="sectionhead"><div><h2>صور وبنرات المتجر</h2><p>غيّر صورة واجهة الموقع الرئيسية مع الاحتفاظ بنفس التصميم</p></div></div>';
 out+='<form id="media-form"><div class="setting-block"><h3>الصورة الرئيسية</h3><div class="setting-grid"><div class="field"><label for="hero-image">رفع صورة جديدة</label><input id="hero-image" name="hero" type="file" accept="image/png,image/jpeg,image/webp"><p class="hint">PNG أو JPG أو WebP، بحجم أقل من 2 ميغابايت</p></div><div class="field"><label>معاينة الصورة الحالية</label><img id="hero-preview" alt="صورة واجهة المتجر" src="'+escape(photo(img||'iphone15.png'))+'" style="height:180px;width:100%;object-fit:contain;border:1px solid #e4eaf2;border-radius:12px;background:#fff;padding:10px"></div></div><p class="panel-note">إذا ما رفعت صورة جديدة، يبقى التصميم كما هو.</p></div><div class="setting-actions"><button class="primary" type="submit">حفظ صورة الواجهة ←</button></div></form></section>';
}
$('#content').innerHTML=out;
if($('#import-legacy'))$('#import-legacy').onclick=async()=>{
 const btn=$('#import-legacy');
 btn.disabled=true;btn.textContent='جارٍ فحص بيانات الموقع القديم...';
 try{
   const check=await request('import-preflight',{});
   if(!confirm('وجدنا '+check.products+' منتج و'+check.categories+' قسم و'+check.images+' صورة مرفوعة. هل تريد نسخها إلى Cloudflare الآن؟\nلن تتغير بيانات موقع Netlify القديم.')){btn.disabled=false;btn.textContent='استيراد المنتجات والصور من الموقع القديم ←';return}
   btn.textContent='جارٍ نقل المنتجات والصور، انتظر...';
   const result=await request('import',{});
   await load();
   note('نجح الاستيراد: '+result.products+' منتج و'+result.images+' صورة');
 }catch(err){
   btn.disabled=false;btn.textContent='إعادة فحص ومحاولة الاستيراد';
   note(err.message,true);
 }
};
if($('#quick-product'))$('#quick-product').onclick=()=>open('product');
if($('#quick-category'))$('#quick-category').onclick=()=>open('category');
if($('#add-product'))$('#add-product').onclick=()=>open('product');
if($('#add-category'))$('#add-category').onclick=()=>open('category');
document.querySelectorAll('[data-overview-edit]').forEach(b=>b.onclick=()=>open('product',b.dataset.overviewEdit));
if(view==='products'){let search=$('#search'),filter=$('#filter'),condition=$('#condition-filter');search.oninput=filter.onchange=condition.onchange=drawProducts;drawProducts()}
document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>open('category',b.dataset.editCat));
document.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>removeItem('category',b.dataset.delCat));
if($('#settings-form'))$('#settings-form').onsubmit=async e=>{e.preventDefault();let next=JSON.parse(JSON.stringify(catalog)),s=next.site||{};new FormData(e.target).forEach((v,k)=>s[k]=String(v).trim());next.site=s;try{await publish(next)}catch(err){note(err.message,true)}};
if($('#media-form')){
 $('#hero-image').onchange=e=>{const file=e.target.files?.[0];if(file){const url=URL.createObjectURL(file);$('#hero-preview').src=url;$('#hero-preview').onload=()=>URL.revokeObjectURL(url)}};
 $('#media-form').onsubmit=async e=>{e.preventDefault();let button=e.target.querySelector('button[type=submit]');button.disabled=true;try{const file=e.target.elements.hero.files?.[0];if(!file)throw Error('اختار صورة جديدة أولاً');const img=await upload(file);let next=JSON.parse(JSON.stringify(catalog));next.site={...(next.site||{}),heroImage:img};await publish(next)}catch(err){note(err.message,true)}finally{button.disabled=false}};
}
}
function drawProducts(){
let q=($('#search').value||'').toLowerCase(),c=$('#filter').value,state=$('#condition-filter').value;
let items=catalog.products.filter(p=>(!c||p.category===c)&&(!state||conditionOf(p)===state||conditionOf(p)==='both'&&state!=='both')&&(!q||(p.name+' '+p.brand+' '+(p.variant||'')).toLowerCase().includes(q)));
$('#product-cards').innerHTML=items.length?items.map(p=>{
let cond=conditionOf(p),amount=cond==='used'?p.prices?.used?.[0]:p.prices?.new?.[0],label=cond==='used'?'مستعمل':cond==='new'?'جديد':'جديد ومستعمل',quality=cond==='used'&&Number.isInteger(p.cleanliness)?' · النظافة '+p.cleanliness+'%':'';
return '<article class="product"><img src="'+escape(photo(p.image))+'" alt="صورة '+escape(p.name)+'"><span class="label-tag">'+escape(catalog.categories.find(c=>c.id===p.category)?.title||'')+'</span><h3>'+escape(p.name)+'</h3><p>'+escape(p.brand)+' · '+escape(p.variant||'')+'</p><div class="p-status"><span class="'+(cond==='used'?'used':'')+'">'+label+'</span>'+(p.active===false?'<span class="hidden-product">مخفي</span>':'')+'</div><p>'+escape(quality||p.description||'')+'</p><p class="p-price">من '+Number(amount||0).toLocaleString('en-US')+' د.ع</p><div class="buttons"><button class="secondary" data-edit-product="'+escape(p.id)+'">تعديل</button><button class="danger" data-del-product="'+escape(p.id)+'">حذف</button></div></article>'
}).join(''):'<p class="empty">ماكو منتجات مطابقة لبحثك. جرّب تغيير الفلاتر.</p>';
document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>open('product',b.dataset.editProduct));
document.querySelectorAll('[data-del-product]').forEach(b=>b.onclick=()=>removeItem('product',b.dataset.delProduct));
}
function field(name,label,value,type,extra){return '<div class="field '+(extra||'')+'"><label>'+label+'</label>'+(type==='textarea'?'<textarea name="'+name+'">'+escape(value||'')+'</textarea>':type==='select'?'<select name="'+name+'">'+selectOptions(catalog.categories,value)+'</select>':'<input name="'+name+'" type="'+(type||'text')+'" value="'+escape(value??'')+'">')+'</div>'}
function toggleConditionFields(){
 const input=$('#product-condition');if(!input)return;
 const cond=input.value,quality=$('#cleanliness-field'),pct=$('#cleanliness-input');
 $('#new-price-fields').classList.toggle('hide',cond==='used');
 $('#used-price-fields').classList.toggle('hide',cond==='new');
 quality.classList.toggle('hide',cond!=='used');
 pct.required=cond==='used';
}
function open(t,id){kind=t;editing=id||null;let obj=t==='product'?catalog.products.find(p=>p.id===id):catalog.categories.find(c=>c.id===id);obj=obj||{};$('#dialog-title').textContent=(id?'تعديل ':'إضافة ')+(t==='product'?'منتج':'قسم');let s='';
if(t==='product'){
 s+='<div class="form-section-title">١. بيانات المنتج الأساسية</div>';
 const cond=id?conditionOf(obj):'new';
 const choice=(v,title)=>'<option value="'+v+'" '+(cond===v?'selected':'')+'>'+title+'</option>';
 s+=field('name','اسم المنتج',obj.name)+field('brand','الماركة',obj.brand)+field('category','القسم',obj.category||catalog.categories[0].id,'select')+field('sub','التصنيف الفرعي',obj.sub)+field('variant','النسخة أو السعة',obj.variant)+field('imagefile','صورة المنتج',null,'file')+'<div class="field"><label>معاينة الصورة</label><img id="editor-image-preview" src="'+escape(photo(obj.image||'iphone15.png'))+'" alt="معاينة الصورة" style="width:100%;height:135px;object-fit:contain;background:#f5f8fc;border:1px solid #dfe8f3;border-radius:11px;padding:7px"></div>'+field('description','الوصف',obj.description,'textarea','wide');
 s+='<div class="form-section-title">٢. حالة الجهاز والأسعار</div>';
 s+='<div class="field wide"><label for="product-condition">حالة الجهاز</label><select id="product-condition" name="condition" required>'+choice('new','جديد')+choice('used','مستعمل')+(id&&cond==='both'?choice('both','جديد ومستعمل (منتج قديم)'):'')+'</select><p class="hint">المنتج الجديد يظهر كعرض واحد فقط. المستعمل تظهر له نسبة النظافة.</p></div>';
 s+='<div class="field wide" id="cleanliness-field"><label for="cleanliness-input">نسبة نظافة الجهاز (من 100%)</label><input id="cleanliness-input" name="cleanliness" type="number" min="1" max="100" step="1" value="'+escape(obj.cleanliness??100)+'"><p class="hint">تقييم للنظافة والحالة الخارجية، وليس نسبة صحة البطارية.</p></div>';
 s+='<div id="new-price-fields" class="condition-price-fields">'+field('newmin','سعر الجديد من',obj.prices?.new?.[0]??0,'number')+field('newmax','سعر الجديد إلى',obj.prices?.new?.[1]??0,'number')+'</div>';
 s+='<div id="used-price-fields" class="condition-price-fields">'+field('usedmin','سعر المستعمل من',obj.prices?.used?.[0]??0,'number')+field('usedmax','سعر المستعمل إلى',obj.prices?.used?.[1]??0,'number')+'</div>';
 s+='<div class="form-section-title">٣. المواصفات والنشر</div>';
 s+=field('specs','المواصفات: كل سطر «العنوان: القيمة»',(obj.specs||[]).map(x=>x.join(': ')).join('\n'),'textarea','wide')+'<div class="field"><label><input name="active" type="checkbox" '+(obj.active!==false?'checked':'')+'> المنتج ظاهر في المتجر</label></div>';
}
else s+=field('title','اسم القسم',obj.title)+field('short','الاسم المختصر',obj.short)+field('sub','الوصف',obj.sub)+field('line','الجملة الترويجية',obj.line)+field('imagefile','صورة القسم',null,'file');
$('#fields').innerHTML=s;$('#modal').classList.add('show');if(t==='product'){$('#product-condition').addEventListener('change',toggleConditionFields);toggleConditionFields();const file=$('#fields input[name=imagefile]');file.onchange=e=>{const photo=e.target.files?.[0];if(photo){const url=URL.createObjectURL(photo);const preview=$('#editor-image-preview');preview.onload=()=>URL.revokeObjectURL(url);preview.src=url}}}}
function close(){$('#modal').classList.remove('show')}$('#close').onclick=close;$('#cancel').onclick=close;
async function upload(f){if(!f||!f.size)return null;if(f.size>2000000)throw Error('حجم الصورة يجب ألا يتجاوز 2 ميغابايت');let ext=(f.name.split('.').pop()||'').toLowerCase();if(!['png','jpg','jpeg','webp'].includes(ext))throw Error('استخدم PNG أو JPG أو WebP');let b64=await new Promise((ok,bad)=>{let reader=new FileReader();reader.onload=()=>ok(String(reader.result).split(',')[1]);reader.onerror=bad;reader.readAsDataURL(f)});return(await request('upload',{image:{ext:ext,data:b64}})).image}
$('#editor').onsubmit=async e=>{e.preventDefault();let btn=$('#editor button[type=submit]');btn.disabled=true;btn.textContent='جارٍ الحفظ...';try{
let next=JSON.parse(JSON.stringify(catalog)),f=new FormData(e.target),obj=kind==='product'?next.products.find(p=>p.id===editing):next.categories.find(c=>c.id===editing);obj=obj?{...obj}:{id:(kind==='product'?'p':'c')+Date.now()};
let photoFile=f.get('imagefile');let newPhoto=await upload(photoFile);if(newPhoto)obj.image=newPhoto;else if(!obj.image)obj.image='iphone15.png';
if(kind==='product'){['name','brand','category','sub','variant','description'].forEach(k=>obj[k]=String(f.get(k)||'').trim());const state=String(f.get('condition')||'new');if(!['new','used','both'].includes(state))throw Error('اختار حالة الجهاز');obj.condition=state;
if(state==='used'){const q=Number(f.get('cleanliness'));if(!Number.isInteger(q)||q<1||q>100)throw Error('أدخل نسبة نظافة صحيحة من 1 إلى 100');obj.cleanliness=q}else delete obj.cleanliness;
obj.prices={new:state==='used'?[0,0]:[Number(f.get('newmin')),Number(f.get('newmax'))],used:state==='new'?[0,0]:[Number(f.get('usedmin')),Number(f.get('usedmax'))]};
for(const cond of (state==='both'?['new','used']:[state])){const [min,max]=obj.prices[cond];if(!Number.isSafeInteger(min)||!Number.isSafeInteger(max)||min<=0||max<min)throw Error('أدخل سعراً صحيحاً يبدأ من 1 دينار، وسعر النهاية لا يقل عن البداية')}obj.specs=String(f.get('specs')||'').split('\n').filter(x=>x.trim()).map(x=>{let a=x.split(':');return [a.shift().trim(),a.join(':').trim()]});obj.active=f.get('active')==='on';if(!obj.name)throw Error('اكتب اسم المنتج');if(!editing)next.products.unshift(obj);else Object.assign(next.products.find(p=>p.id===editing),obj)}
else{['title','short','sub','line'].forEach(k=>obj[k]=String(f.get(k)||'').trim());if(!obj.title)throw Error('اكتب اسم القسم');if(!editing)next.categories.push(obj);else Object.assign(next.categories.find(c=>c.id===editing),obj)}
await publish(next);close()
}catch(err){note(err.message,true)}finally{btn.disabled=false;btn.textContent='حفظ ونشر على المتجر'}
};
async function removeItem(t,id){let name=t==='product'?catalog.products.find(p=>p.id===id)?.name:catalog.categories.find(c=>c.id===id)?.title;if(!confirm('متأكد تريد حذف «'+name+'»؟'))return;if(t==='category'&&catalog.products.some(p=>p.category===id)){note('انقل منتجات القسم أو احذفها أولاً',true);return}let next=JSON.parse(JSON.stringify(catalog)),key=t==='product'?'products':'categories';next[key]=next[key].filter(x=>x.id!==id);try{await publish(next)}catch(err){note(err.message,true)}}
if(token)load().catch(()=>{token='';sessionStorage.removeItem('dubai-admin-v2-token');showapp(false)});
})();
</script></body></html>
